plugins {
    id 'application'
}

repositories { mavenCentral() }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
application {
    mainClass = 'com.bookverse.packapps.core.Start'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('start') { dependsOn 'run' }

def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def arch = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'arm64' : 'x86_64'
def nativePlatform = (os.contains('mac') ? 'macosx' : os.contains('windows') ? 'windows' : 'linux') + '-' + arch

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    implementation 'com.jtattoo:JTattoo:1.6.13'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.apache.poi:poi:5.4.1'
    implementation 'com.sun.mail:jakarta.mail:2.0.2'
    implementation 'com.google.zxing:javase:3.5.4'
    implementation 'commons-codec:commons-codec:1.19.0'
    implementation 'org.slf4j:slf4j-simple:2.0.17'
    runtimeOnly 'org.apache.logging.log4j:log4j-to-slf4j:2.25.3'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.54.1.0'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.7'
    implementation 'org.bytedeco:tesseract:5.5.3-1.5.14'
    runtimeOnly "org.bytedeco:tesseract:5.5.3-1.5.14:${nativePlatform}"
    runtimeOnly "org.bytedeco:leptonica:1.87.0-1.5.14:${nativePlatform}"
    runtimeOnly "org.bytedeco:javacpp:1.5.14:${nativePlatform}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform(); jvmArgs '--enable-native-access=ALL-UNNAMED' }
test {
    systemProperty 'packapps.testClasspath', sourceSets.test.runtimeClasspath.asPath
}
processResources {
    from(files('LICENSE', 'THIRD_PARTY.md')) { into 'META-INF/packapps' }
}
