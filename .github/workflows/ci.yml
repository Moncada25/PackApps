name: Pull request checks
on:
  pull_request:
    branches: [trunk]
permissions:
  contents: read
jobs:
  packages:
    uses: ./.github/workflows/packages.yml
  database:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: packapps
          MYSQL_ROOT_HOST: '%'
        ports: ['127.0.0.1:3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: SQLite
        run: ./gradlew clean build
      - name: MySQL
        env:
          PACKAPPS_MYSQL_URL: jdbc:mariadb://127.0.0.1:3306/packapps
          PACKAPPS_MYSQL_USER: root
          PACKAPPS_MYSQL_PASSWORD: ''
        run: |
          mysql -h 127.0.0.1 -u root packapps < src/main/resources/data/mysql.sql
          ./gradlew test --rerun-tasks
  validate:
    needs: [packages, database]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.packages.result }}" = success && test "${{ needs.database.result }}" = success
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
